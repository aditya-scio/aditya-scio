<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" width="1200" height="460" role="img" aria-label="Aditya Kumar, Early Engineer at Glean">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF2E93"><animate attributeName="stop-color" values="#FF2E93;#FF8A00;#7C3AED;#FF2E93" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="0.5" stop-color="#7C3AED"><animate attributeName="stop-color" values="#7C3AED;#FF2E93;#00C2FF;#7C3AED" dur="9s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#00C2FF"><animate attributeName="stop-color" values="#00C2FF;#7C3AED;#FF8A00;#00C2FF" dur="9s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="48"/></filter>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2.2" fill="#FFFFFF" opacity="0.2"/></pattern>
    <clipPath id="clip"><rect width="1200" height="460" rx="30"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="460" fill="url(#bg)"/>
    <circle cx="180" cy="90" r="170" fill="#FFD600" opacity="0.8" filter="url(#blur)">
      <animate attributeName="cx" values="180;420;180" dur="11s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="90;230;90" dur="8s" repeatCount="indefinite"/>
